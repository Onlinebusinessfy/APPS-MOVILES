<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Tasklist V2</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-item>
    <ion-input
      type="text"
      placeholder="Ingresa una nueva tarea..."
      name="task"
      [(ngModel)]="newTaskStr">
    </ion-input>

    <ion-button (click)="addTask()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-button>
  </ion-item>

  @if (tasks.length > 0) {

    <ion-list>

      <ion-reorder-group
        [disabled]="false"
        (ionItemReorder)="actualizarPosiciones($event)">

        @for (task of tasks; track task.id) {

          <ion-item-sliding>

            <ion-item>

              <ion-label>
                {{ task.title }}
              </ion-label>

              <ion-reorder slot="end"></ion-reorder>

            </ion-item>

            <ion-item-options side="end">

              <ion-item-option
                color="danger"
                expandable="true"
                (click)="confirmDelete(task)">

                <ion-icon
                  name="trash-outline"
                  slot="icon-only">
                </ion-icon>

              </ion-item-option>

            </ion-item-options>

          </ion-item-sliding>

        }

      </ion-reorder-group>

    </ion-list>

  } @else {

    <ion-item lines="none" class="ion-text-center">
      No hay tareas pendientes
    </ion-item>

  }

</ion-content>
